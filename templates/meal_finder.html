<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meal Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Include the external JavaScript file -->
    <script src="{{ url_for('static', path='js/meal_finder.js') }}"></script>
    <style>
        body {
            background-color: #f0f2f5;
        }

        .meal-card {
            background: #fff;
            border: none;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .meal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.13);
            cursor: pointer;
        }

        .meal-card .card-img-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #e9ecef;
        }

        .meal-card .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .meal-card .card-body {
            padding: 1rem 1.1rem 0.6rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .meal-card .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #1a1a2e;
        }

        .meal-card .card-desc {
            font-size: 0.82rem;
            color: #6c757d;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.7rem;
            flex: 1;
        }

        .meal-card .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.75rem;
        }

        .meal-card .tag {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            white-space: nowrap;
        }

        .tag-cuisine  { background: #e0f0ff; color: #0066cc; }
        .tag-mode     { background: #e8f5e9; color: #2e7d32; }
        .tag-ease     { background: #fff3e0; color: #e65100; }

        .meal-card .card-footer-inner {
            border-top: 1px solid #f0f0f0;
            margin: 0 -1.1rem;
            padding: 0.55rem 1.1rem 0.7rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .meal-card .stat-item {
            font-size: 0.75rem;
            color: #888;
        }

        .meal-card .stat-item strong {
            color: #444;
        }

        .meal-card .action-row {
            display: flex;
            gap: 0.5rem;
        }

        .meal-card .btn-view {
            font-size: 0.75rem;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            border: 1.5px solid #0d6efd;
            color: #0d6efd;
            background: transparent;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.15s, color 0.15s;
        }

        .meal-card .btn-view:hover {
            background: #0d6efd;
            color: #fff;
        }

        .meal-card .btn-source {
            font-size: 0.75rem;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            border: 1.5px solid #6c757d;
            color: #6c757d;
            background: transparent;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.15s, color 0.15s;
        }

        .meal-card .btn-source:hover {
            background: #6c757d;
            color: #fff;
        }
    </style>
    
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Find Your Next Meal</h1>
        
        <div class="mb-3">
            <a href="/entry">Enter new meal</a>
            <span class="mx-2">|</span>
            <a href="/dashboard">Dashboard</a>
        </div>

        <div class="row g-2 mb-4 align-items-end">
            <div class="col-12 col-md-4">
                <input type="text" id="filter-search" class="form-control" placeholder="Search meals...">
            </div>
            <div class="col-6 col-md-2">
                <select id="filter-cuisine" class="form-select">
                    <option value="">All Cuisines</option>
                    <option value="American">American</option>
                    <option value="Italian">Italian</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Indian">Indian</option>
                    <option value="Creole">Creole</option>
                    <option value="Chinese">Chinese</option>
                    <option value="Thai">Thai</option>
                    <option value="Cuban">Cuban</option>
                    <option value="BBQ">BBQ</option>
                    <option value="Greek">Greek</option>
                    <option value="Caribbean">Caribbean</option>
                    <option value="Korean">Korean</option>
                    <option value="Middle Eastern">Middle Eastern</option>
                    <option value="Mediterranean">Mediterranean</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select id="filter-mode" class="form-select">
                    <option value="">All Modes</option>
                    <option value="Instant Pot">Instant Pot</option>
                    <option value="Stir Fry">Stir Fry</option>
                    <option value="Bake">Bake</option>
                    <option value="Boil">Boil</option>
                    <option value="Grill">Grill</option>
                    <option value="Stovetop">Stovetop</option>
                    <option value="Mixed">Mixed</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select id="filter-ease" class="form-select">
                    <option value="">All Ease</option>
                    <option value="quick">Quick</option>
                    <option value="moderate">Moderate</option>
                    <option value="time-consuming">Time-consuming</option>
                    <option value="weeknight">Weeknight</option>
                    <option value="weekend">Weekend</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <button id="clear-filters-btn" class="btn btn-outline-secondary w-100">Clear</button>
            </div>
        </div>

        <div id="meal-list" class="row g-4"></div>
        
        <div class="text-center mt-4">
            <button id="next-btn" class="btn btn-primary">Next 10 Meals</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
